spring:
  application:
    name: licence-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/ddrs_licence
    username: ${DB_USER:ddrs_user}
    password: ${DB_PASSWORD:ddrs_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: public

jwt:
  secret: cdsco_mock_jwt_secret_key_needs_to_be_long_enough_for_hs256

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8083
