server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ddrs_identity}
    username: ${SPRING_DATASOURCE_USERNAME:ddrs_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ddrs_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:ddrs_super_secret_key_for_jwt_generation_2026_default_fallback_which_needs_to_be_long_enough_for_hs256}
  expiration: 86400000 # 24 hours in ms
  refresh-expiration: 604800000 # 7 days in ms
  issuer: "https://auth.cdsco.gov.in/realms/ddrs"
